name: build-ipa

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          brew install xcodegen
          xcodegen generate
          ls -la AXOverlayStudio.xcodeproj

      - name: Build unsigned IPA
        run: |
          set -euo pipefail
          DERIVED="$RUNNER_TEMP/DerivedData"
          BUNDLE_ID="${{ vars.BUNDLE_ID || 'com.yourteam.axoverlay' }}"
          echo "== build app =="
          xcodebuild -project AXOverlayStudio.xcodeproj -scheme AXOverlayStudio -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED" \
            BUNDLE_ID="$BUNDLE_ID" \
            ARCHS=arm64e \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            clean build
          echo "== build handler dylib =="
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun -sdk iphoneos clang -arch arm64e -dynamiclib -fobjc-arc \
            -miphoneos-version-min=16.5 \
            -isysroot "$SDK" \
            -I AXOverlayHandler \
            -o build/libAXOverlayHandler.dylib \
            AXOverlayHandler/AXOverlayHandler.m \
            -framework Foundation -framework UIKit -framework CoreGraphics
          codesign -f -s - build/libAXOverlayHandler.dylib
          APP=$(find "$DERIVED/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          mkdir -p "$APP/Frameworks"
          cp Vendor/lara/lib/libxpf.dylib "$APP/Frameworks/libxpf.dylib"
          cp Vendor/lara/lib/libgrabkernel2.dylib "$APP/Frameworks/libgrabkernel2.dylib"
          test -f build/libAXOverlayHandler.dylib
          cp build/libAXOverlayHandler.dylib "$APP/Frameworks/libAXOverlayHandler.dylib"
          codesign -f -s - "$APP/Frameworks/libxpf.dylib" || true
          codesign -f -s - "$APP/Frameworks/libgrabkernel2.dylib" || true
          codesign -f -s - "$APP/Frameworks/libAXOverlayHandler.dylib" || true
          codesign -f -s - "$APP" || true
          mkdir -p build
          python3 scripts/make_unsigned_ipa.py "$APP" "build/AXOverlayStudio_unsigned.ipa"
          shasum -a 256 build/*.ipa > build/SHA256SUMS.txt
          ls -lh build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipa-unsigned-${{ github.run_number }}
          path: |
            build/*.ipa
            build/*.dylib
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="build-${GITHUB_RUN_NUMBER}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/*.ipa build/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" --title "$TAG" --notes "AX Overlay Studio unsigned IPA" \
              build/*.ipa build/SHA256SUMS.txt
          fi
          echo "release=$TAG"
