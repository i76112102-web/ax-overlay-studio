name: Build AX Overlay Studio IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

env:
  SCHEME: AXOverlayStudio

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.check.outputs.signed }}
    steps:
      - name: Detect signing mode
        id: check
        env:
          HAS_P12: ${{ secrets.SIGNING_P12_BASE64 != '' }}
          HAS_PROV: ${{ secrets.PROVISIONING_PROFILE_BASE64 != '' }}
          HAS_PASS: ${{ secrets.SIGNING_P12_PASSWORD != '' }}
        run: |
          if [ "$HAS_P12" = "true" ] && [ "$HAS_PROV" = "true" ] && [ "$HAS_PASS" = "true" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Signing mode: SIGNED"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Signing mode: UNSIGNED (no complete secrets)"
          fi

  build:
    needs: prepare
    runs-on: macos-14
    timeout-minutes: 45
    env:
      SIGNED: ${{ needs.prepare.outputs.signed }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.yourteam.axoverlay' }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_16.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d /Applications/Xcode_16.1.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          test -d AXOverlayStudio.xcodeproj

      - name: Import signing assets
        if: ${{ needs.prepare.outputs.signed == 'true' }}
        env:
          P12_B64: ${{ secrets.SIGNING_P12_BASE64 }}
          P12_PASS: ${{ secrets.SIGNING_P12_PASSWORD }}
          PROV_B64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/ax-build.keychain-db"
          KEYCHAIN_PASS="ax-build-pass"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN_PATH" -P "$P12_PASS" -T /usr/bin/codesign -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH" >/dev/null 2>&1 || true
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          echo "$PROV_B64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(python3 -c 'import plistlib,sys;print(plistlib.load(open(sys.argv[1],"rb"))["UUID"])' "$RUNNER_TEMP/profile.plist")
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          BUNDLE_ID="$BUNDLE_ID" TEAM_ID="$TEAM_ID" python3 scripts/gen_export_options.py "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/exportOptions.plist"

      - name: Build signed archive and export IPA
        if: ${{ needs.prepare.outputs.signed == 'true' }}
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/AXOverlayStudio.xcarchive"
          xcodebuild -project AXOverlayStudio.xcodeproj -scheme AXOverlayStudio -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            BUNDLE_ID="$BUNDLE_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            CODE_SIGN_STYLE=Manual \
            clean archive
          mkdir -p "$RUNNER_TEMP/export"
          xcodebuild -exportArchive -archivePath "$ARCHIVE" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist"
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' -print -quit)
          test -n "$IPA"
          mkdir -p artifacts
          cp "$IPA" "artifacts/AXOverlayStudio_signed.ipa"
          ls -lh artifacts

      - name: Build unsigned IPA
        if: ${{ needs.prepare.outputs.signed != 'true' }}
        run: |
          set -euo pipefail
          DERIVED="$RUNNER_TEMP/DerivedData"
          xcodebuild -project AXOverlayStudio.xcodeproj -scheme AXOverlayStudio -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED" \
            BUNDLE_ID="$BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            clean build
          APP=$(find "$DERIVED/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          mkdir -p artifacts
          python3 scripts/make_unsigned_ipa.py "$APP" "artifacts/AXOverlayStudio_unsigned.ipa"
          ls -lh artifacts

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AXOverlayStudio_${{ needs.prepare.outputs.signed == 'true' && 'signed' || 'unsigned' }}
          path: artifacts/*.ipa
          if-no-files-found: error
          retention-days: 30
