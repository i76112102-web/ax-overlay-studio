name: AXOverlayStudio

options:
  bundleIdPrefix: com.yourteam
  deploymentTarget:
    iOS: "16.5"
  groupSortPosition: none
  fileTypes:
    dylib:
      file: true

settingGroups:
  common:
    IPHONEOS_DEPLOYMENT_TARGET: "16.5"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTED_PLATFORMS: "iphoneos"
    SDKROOT: iphoneos
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    MODULES: YES
    ENABLE_BITCODE: NO
    ONLY_ACTIVE_ARCH: NO
    ARCHS: arm64e
    GCC_NO_COMMON_BLOCKS: YES
    GCC_WARN_UNDECLARED_SELECTOR: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: ""
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
    CODE_SIGN_ENTITLEMENTS: Entitlements/app.entitlements
    HEADER_SEARCH_PATHS:
      - "$(inherited)"
      - "$(SRCROOT)/Sources"
      - "$(SRCROOT)/CrossApp"
      - "$(SRCROOT)/DarkSwordIntegration"
      - "$(SRCROOT)/Vendor/lara/kexploit"
      - "$(SRCROOT)/Vendor/lara/kexploit/pe"
      - "$(SRCROOT)/Vendor/lara/kexploit/TaskRop"
      - "$(SRCROOT)/Vendor/lara/headers"
      - "$(SRCROOT)/Vendor/lara/lib/choma"
    LIBRARY_SEARCH_PATHS:
      - "$(inherited)"
      - "$(SRCROOT)/Vendor/lara/lib"
    LD_RUNPATH_SEARCH_PATHS:
      - "@executable_path/Frameworks"
      - "@loader_path/Frameworks"
    OTHER_LDFLAGS:
      - "-ObjC"
      - "-lxpf"
      - "-lgrabkernel2"
      - "-lz"

targets:
  AXOverlayStudio:
    type: application
    platform: iOS
    settings:
      groups:
        - common
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(BUNDLE_ID)"
        PRODUCT_NAME: AXOverlayStudio
        INFOPLIST_FILE: Info.plist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
    sources:
      - path: Sources
        type: group
      - path: CrossApp
        type: group
      - path: DarkSwordIntegration
        type: group
      - path: Vendor/lara/kexploit
        type: group
        excludes:
          - "*.md"
          - "TaskRop/findcachedataoff.m"  # 未被 shim 引用；@import MachO 在无 Swift 桥接工程里易触发模块找不到，需要时再单独接入
    copyFiles:
      - destination: frameworks
        files:
          - path: Vendor/lara/lib/libxpf.dylib
          - path: Vendor/lara/lib/libgrabkernel2.dylib
  AXOverlayHandler:
    type: dynamicLibrary
    platform: iOS
    settings:
      base:
        PRODUCT_NAME: AXOverlayHandler
        IPHONEOS_DEPLOYMENT_TARGET: "16.5"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: "iphoneos"
        SDKROOT: iphoneos
        ARCHS: arm64e
        ONLY_ACTIVE_ARCH: NO
        ENABLE_BITCODE: NO
        CLANG_ENABLE_MODULES: YES
        CLANG_ENABLE_OBJC_ARC: YES
        SKIP_INSTALL: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
    sources:
      - path: AXOverlayHandler
        type: group
